    <div><b>Label:</b> ${node.label}</div>
    <div><b>Community:</b> ${node.community_name}</div>
    <div><b>Source:</b> <code>${node.source_file}</code></div>
    <div><b>Degree:</b> ${node.degree}</div>
    <div><b>Related:</b> ${neighbors.join(', ') || 'None'}</div>`;
  network.selectNodes([id]);
  network.focus(id, { scale: 1.2, animation: true });
}
network.on('click', params => { if (params.nodes.length) showNode(params.nodes[0]); });
const search = document.getElementById('search');
const results = document.getElementById('search-results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.style.display = 'none'; results.innerHTML = ''; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  results.innerHTML = matches.map(n => `<div class="search-item" data-id="${n.id}">${n.label} <span style="color:#777">(${''}${n.community_name})</span></div>`).join('');
  results.style.display = matches.length ? 'block' : 'none';
  Array.from(results.querySelectorAll('.search-item')).forEach(el => el.onclick = () => showNode(el.dataset.id));
});
document.getElementById('legend').innerHTML = COMMUNITY_META.map(c => `<div class="legend-item"><span class="legend-dot" style="background:${c.color}"></span><span>${c.name}</span><span style="color:#777">(${c.count})</span></div>`).join('');
</script>
</body>
</html>
