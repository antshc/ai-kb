name: Validate and auto-merge Graphify PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
    paths:
      - graphify-out/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: graphify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-graphify-output:
    name: validate-graphify-output
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automated-ingest/graphify' &&
      startsWith(github.event.pull_request.title, '[graphify] ') &&
      contains(github.event.pull_request.labels.*.name, 'graphify')
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR contents
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')"

          test -n "${changed_files}"
          while IFS= read -r file; do
            case "${file}" in
              graphify-out/*) ;;
              *)
                echo "Unexpected changed file: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "${changed_files}"

      - name: Validate Graphify JSON and source paths
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          graph_path = Path("graphify-out/graph.json")
          graph = json.loads(graph_path.read_text(encoding="utf-8"))

          nodes = graph.get("nodes")
          links = graph.get("links")
          if not isinstance(nodes, list) or not nodes:
              raise SystemExit("graph.json must contain a non-empty nodes list")
          if not isinstance(links, list):
              raise SystemExit("graph.json must contain a links list")

          for node in nodes:
              source_file = node.get("source_file")
              if source_file is None:
                  continue
              normalized = str(source_file).replace("\\", "/")
              if not normalized.startswith("raw/"):
                  raise SystemExit(f"source path escapes raw/: {source_file}")
              if not Path(normalized).is_file():
                  raise SystemExit(f"source file does not exist: {source_file}")
          PY

  merge-and-deploy-graphify:
    name: merge-and-deploy-graphify
    needs: validate-graphify-output
    if: needs.validate-graphify-output.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge validated Graphify PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "${PR_URL}" --squash --delete-branch

      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
