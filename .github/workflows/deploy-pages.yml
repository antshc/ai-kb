name: Deploy Graphify visualization

on:
  push:
    branches:
      - main
    paths:
      - graphify-out/graph.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate graph source
        run: test -f graphify-out/graph.html

      - name: Prepare deployment artifact
        shell: bash
        run: |
          deploy_dir="$RUNNER_TEMP/graphify-pages"
          mkdir -p "$deploy_dir"
          cp graphify-out/graph.html "$deploy_dir/index.html"

          test "$(find "$deploy_dir" -type f | wc -l)" -eq 1
          test "$(find "$deploy_dir" -type f -printf '%f\n')" = "index.html"
          echo "DEPLOY_DIR=$deploy_dir" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
